  .modulex-sayac-kat-plani-ic { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(32px, 5vw, 80px); align-items: start; }
  .modulex-sayac-kat-plani-bas { position: sticky; inset-block-start: 96px; margin: 0; }
  .modulex-sayac-kat-plani--bassiz .modulex-sayac-kat-plani-ic { grid-template-columns: minmax(0, 1fr); }
  .modulex-sayac-kat-plani-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }

  .modulex-sayac-kat-plani-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-kat-plani-proje { display: grid; gap: 22px; }
  .modulex-sayac-kat-plani-plan { position: relative; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-radius: 4px; background: --text--; box-shadow: 0 30px 60px -45px color-mix(in srgb, --text-- 70%, transparent); }
  .modulex-sayac-kat-plani-oda { position: relative; display: flex; flex: var(--g) 1 calc(var(--g) * 84px); flex-direction: column; min-width: 132px; align-items: flex-start; gap: 2px; min-height: 160px; padding: 16px; border: 0; border-radius: 2px; background: --bg--; color: --text--; font: inherit; text-align: start; transition: background 0.3s ease; }
  .modulex-sayac-kat-plani:not(.modulex-sayac-kat-plani--js) .modulex-sayac-kat-plani-oda { cursor: default; }
  .modulex-sayac-kat-plani--js .modulex-sayac-kat-plani-oda:hover { background: color-mix(in srgb, --accent-- 7%, --bg--); }
  .modulex-sayac-kat-plani--js .modulex-sayac-kat-plani-oda[aria-pressed="true"] { background: repeating-linear-gradient(45deg, color-mix(in srgb, --accent-- 15%, --bg--) 0 8px, color-mix(in srgb, --accent-- 6%, --bg--) 8px 16px), color-mix(in srgb, --accent-- 10%, --bg--); }
  .modulex-sayac-kat-plani-kapi { position: absolute; inset-block-start: 0; inset-inline-end: 18px; width: 34px; height: 34px; border-block-end: 2px solid --muted--; border-inline-start: 2px solid --muted--; border-end-start-radius: 34px; }
  .modulex-sayac-kat-plani-oda-i { margin-block-end: auto; color: --accentInk--; font-size: 26px; }
  .modulex-sayac-kat-plani-oda-d { font-size: clamp(1.5rem, 2.6vw, 2.1rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-sayac-kat-plani-oda-ad { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; line-height: 1.3; text-transform: uppercase; }
  .modulex-sayac-kat-plani-pusula { position: absolute; inset-block-start: -12px; inset-inline-end: -10px; z-index: 2; display: grid; place-items: center; width: 40px; height: 40px; border: 2px solid --text--; border-radius: 50%; background: --bg--; color: --text--; }
  .modulex-sayac-kat-plani-pusula-i { font-size: 22px; }
  .modulex-sayac-kat-plani-lejant { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
  .modulex-sayac-kat-plani--js .modulex-sayac-kat-plani-lejant { grid-template-columns: minmax(0, 1fr); }
  .modulex-sayac-kat-plani-detay { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 4px 18px; padding: 18px 20px; border-block-start: 3px solid --text--; background: --kartBg--; animation: modulex-sayac-kat-plani-ciz 0.45s ease both; }
  [dir="rtl"] .modulex-sayac-kat-plani-detay { animation-name: modulex-sayac-kat-plani-ciz-r; }
  @keyframes modulex-sayac-kat-plani-ciz { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } }
  @keyframes modulex-sayac-kat-plani-ciz-r { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0); } }
  .modulex-sayac-kat-plani-oda-no { grid-column: 1 / -1; color: --accentInk--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; }
  .modulex-sayac-kat-plani-sayi { grid-row: span 2; font-size: clamp(2.2rem, 4vw, 3rem); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
  .modulex-sayac-kat-plani-ek { color: --accentInk--; font-size: 0.5em; }
  .modulex-sayac-kat-plani-etiket { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; font-weight: 700; }
  .modulex-sayac-kat-plani-ikon { color: --accentInk--; font-size: 20px; }
  .modulex-sayac-kat-plani-not { color: --muted--; font-size: 0.92rem; }
  @media (max-width: 768px) {
    .modulex-sayac-kat-plani-oda { flex-basis: 130px; min-height: 124px; padding: 12px; }
    .modulex-sayac-kat-plani-detay { grid-template-columns: minmax(0, 1fr); }
    .modulex-sayac-kat-plani-sayi { grid-row: auto; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kat-plani :is(.modulex-sayac-kat-plani-baslik, .modulex-sayac-kat-plani-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-kat-plani-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-sayac-kat-plani-ic { grid-template-columns: minmax(0, 1fr); }
    .modulex-sayac-kat-plani-bas { position: static; margin-block-end: 32px; }
  }
  @media (max-width: 768px) {
    .modulex-sayac-kat-plani { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-kat-plani *, .modulex-sayac-kat-plani *::before, .modulex-sayac-kat-plani *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-kat-plani";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sayac = (s, P, az) => {
        const el = [...s.querySelectorAll("[data-hedef]")];
        if (!el.length || az || !("IntersectionObserver" in window)) return;
        const dl = document.documentElement.lang || undefined;
        const oynat = () => el.forEach((e) => {
          const h = Number(e.dataset.hedef);
          const od = Number(e.dataset.ondalik) || 0;
          const son = e.textContent;
          if (!Number.isFinite(h)) return;
          let f;
          try { f = new Intl.NumberFormat(dl, { minimumFractionDigits: od, maximumFractionDigits: od }); } catch (x) { return; }
          const t0 = performance.now();
          const adim = (t) => {
            const p = Math.min(1, (t - t0) / 1300);
            e.textContent = p < 1 ? f.format(h * (1 - Math.pow(1 - p, 3))) : son;
            if (p < 1) requestAnimationFrame(adim);
          };
          requestAnimationFrame(adim);
        });
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { oynat(); io.disconnect(); } });
        }, { threshold: 0.3 });
        io.observe(s);
      };
    const secim = (s, P) => {
        const c = [...s.querySelectorAll("[data-sec]")];
        const p = [...s.querySelectorAll("[data-secim]")];
        if (!c.length) return;
        s.classList.add(P + "--js");
        const sec = (n) => {
          c.forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.sec === n)));
          p.forEach((x) => { x.hidden = x.dataset.secim !== n; });
        };
        sec(c[0].dataset.sec);
        c.forEach((x) => x.addEventListener("click", () => sec(x.dataset.sec)));
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sayac(s, P, az);
      secim(s, P, az);
    });
  })();
</script>
