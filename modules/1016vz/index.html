<script>
  (() => {
    const P = "modulex-referans-acilan-panel";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const acilanPanel = (s, P) => {
        const p = [...s.querySelectorAll("[data-ap]")];
        if (p.length < 2) return;
        s.classList.add(P + "--ajs");
        const ac = (el) => p.forEach((x) => {
          const a = x === el;
          x.classList.toggle(P + "-pnl--acik", a);
          const b = x.querySelector("[aria-expanded]");
          if (b) b.setAttribute("aria-expanded", String(a));
        });
        const mq = window.matchMedia ? window.matchMedia("(hover: hover) and (min-width: 769px)") : null;
        p.forEach((x) => {
          const b = x.querySelector("[aria-expanded]");
          if (b) b.addEventListener("click", () => ac(x));
          x.addEventListener("pointerenter", () => { if (mq && mq.matches) ac(x); });
        });
        ac(p.find((x) => x.classList.contains(P + "-pnl--acik")) || p[0]);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      acilanPanel(s, P, az);
    });
  })();
</script>
